<section data-title="Internal Medicine">
<script type="text/markdown">
# Internal Medicine: high-yield

**Known** = standard guideline or textbook facts. **Estimated** = my judgment of exam frequency.
**Sources:** Harrison's 21e, ACC/AHA, ADA, KDIGO, GOLD and AASLD guidelines. These are from my training knowledge, not looked up live.

## 1. Decision rules
- Unstable patient: stabilize first (ABC, fluids, ECG), test later.
- "Next best step" means the least invasive action that changes management. "Most accurate" means the gold standard.
- For chronic disease, pick the drug with a **mortality benefit**.
- When there is a life-threatening complication, treat it before confirming the cause (e.g., hyperK with ECG changes: calcium first).
- If two options look right, choose the one that is first-line and cheaper or safer.

## 2. Highest-yield facts

| Area | Fact |
|---|---|
| STEMI | Aspirin + P2Y12 + heparin, primary PCI within 90 min |
| AF | Anticoagulate if CHA₂DS₂-VASc ≥2 (men) or ≥3 (women). Unstable: cardioversion |
| HFrEF | β-blocker, ACEi/ARNI, MRA, SGLT2i |
| Pericarditis | Diffuse ST↑ with PR↓. NSAID + colchicine |
| DKA | Fluids, then insulin only if K >3.3 |
| T2DM | Metformin first. Add SGLT2i/GLP-1 if ASCVD, HF or CKD |
| Graves | Low TSH, diffuse uptake. Storm: PTU, propranolol, steroids |
| Addison | Low Na, high K, hypotension. Give steroids |
| Hyperkalemia | Ca gluconate, then insulin + glucose, salbutamol |
| Hyponatremia | Correct ≤8–10 mEq/24h (osmotic demyelination) |
| Nephrotic | >3.5 g/day proteinuria. Kids: minimal change (steroids). Adults: membranous |
| Variceal bleed | Octreotide, ceftriaxone, banding |
| SBP | Ascitic PMN ≥250. Ceftriaxone + albumin |
| Hepatic encephalopathy | Lactulose, then rifaximin |
| Celiac | Anti-tTG IgA |
| COPD | Home O₂ improves survival if PaO₂ ≤55 |
| PE | Low probability: D-dimer. Otherwise CTPA. Unstable: thrombolysis |
| Anemia | Iron deficiency: low ferritin, high TIBC. Chronic disease: high ferritin, low TIBC |
| B12 deficiency | Macrocytosis, hypersegmented neutrophils, neuro signs |
| TTP | Plasma exchange |
| CML / APL | t(9;22) → imatinib. t(15;17) → ATRA |
| SLE | Anti-dsDNA and anti-Sm are specific |
| RA | Anti-CCP, methotrexate |
| Gout vs pseudogout | Gout: needle-shaped, negatively birefringent. Pseudogout: rhomboid, positively birefringent |
| Giant cell arteritis | High ESR. Steroids before biopsy |

## 3. Traps and quick rules
- **Giving insulin in DKA before checking K:** fluids first, check K.
- **Platelet transfusion in TTP:** avoid it.
- **Fast Na correction:** it causes osmotic demyelination, so go slow.
- **Choosing a test when the patient is unstable:** treat first.
- **IgA nephropathy vs post-strep GN:** IgA presents 1–3 days after a URI with normal C3. Post-strep presents 1–3 weeks after infection with low C3.
- **Crohn vs UC:** Crohn is skip lesions, transmural, granulomas and fistulas. UC is continuous from the rectum with crypt abscesses and a PSC link.

## 4. Pattern shortcuts
- Syncope + angina + dyspnea → aortic stenosis → AVR.
- Hypotension + JVD + muffled heart sounds → tamponade.
- Fever + anemia + low platelets + renal failure + neuro signs → TTP.
- Hyperpigmentation + hypotension + low Na + high K → Addison.
- Hemoptysis + hematuria → Goodpasture (anti-GBM).
- Jaundice + pruritus + anti-mitochondrial Ab → PBC.

## 5. If you only remember 7 things
1. Unstable: treat first, test later.
2. Choose the drug with a mortality benefit.
3. DKA: fluids, then K, then insulin.
4. HFrEF has four pillars (β-blocker, ACEi/ARNI, MRA, SGLT2i).
5. Hyperkalemia with ECG changes: calcium first.
6. Cirrhosis: SBP → ceftriaxone + albumin. Variceal bleed → octreotide + ceftriaxone.
7. Match the antibody or translocation to the disease (anti-CCP, anti-dsDNA, t(9;22), t(15;17)).

**Estimated:** cardiology, endocrinology and nephrology are probably the heaviest parts of this subject. Check the current Sanjesh syllabus for weights.
</script>

<section data-title="Pediatrics">
<script type="text/markdown">
# Pediatrics: high-yield

**Known** = standard textbook/guideline facts. **Estimated** = my judgment of exam frequency.
**Sources:** Nelson 21e, AAP guidelines, NRP/PALS, from my training knowledge (not looked up live).

## 1. Decision rules
- **Age decides the diagnosis and the organism.** Always anchor on age first.
- Newborn with bilious vomiting is a surgical emergency (volvulus) until proven otherwise.
- Febrile infant <28 days: full sepsis workup, admit, IV ampicillin + gentamicin (or cefotaxime).
- Mild illness is not a vaccine contraindication. Anaphylaxis to a prior dose or component is. Live vaccines are contraindicated in immunocompromise.
- Suspected abuse: report, whatever the caregiver says.

## 2. Highest-yield facts

| Topic | Fact |
|---|---|
| Neonatal jaundice <24h | Always pathologic (hemolysis: ABO/Rh). Phototherapy |
| Conjugated hyperbilirubinemia | Biliary atresia. Kasai ideally before ~60 days |
| RDS | Preterm, ground-glass CXR. Surfactant; antenatal steroids prevent |
| NEC | Preterm, pneumatosis intestinalis |
| Pyloric stenosis | Projectile non-bilious vomiting at 2-6 wk, hypochloremic hypokalemic alkalosis, olive mass. US, correct fluids, then pyloromyotomy |
| Intussusception | 6-36 mo, currant-jelly stool, sausage mass, target sign. Air enema |
| Hirschsprung | No meconium >48h. Rectal suction biopsy |
| Duodenal atresia | Double bubble, associated with Down syndrome |
| VSD / ASD / PDA | VSD most common CHD. ASD: fixed split S2. PDA: continuous machinery murmur (indomethacin/ibuprofen if preterm) |
| TOF | Boot-shaped heart. Tet spell: knee-chest, O₂, morphine, phenylephrine |
| TGA | Egg on a string. Prostaglandin E1 |
| Coarctation | Arm BP > leg BP, rib notching, Turner |
| Kawasaki | Fever ≥5 d + 4 of 5 (conjunctivitis, rash, cervical node, oral changes, extremity changes). IVIG + aspirin; coronary aneurysm |
| HSP | Palpable purpura + arthritis + abdominal pain + nephritis (IgA) |
| Croup | Steeple sign. Dexamethasone ± nebulized epinephrine |
| Epiglottitis | Thumb sign, drooling. Secure airway first |
| Bronchiolitis | RSV, supportive care only |
| Febrile seizure | 6 mo-5 y, simple: no workup, no antiepileptics |
| Rash fevers | Roseola: rash after fever resolves. Measles: Koplik spots. Rubella: posterior auricular nodes |
| Nephrotic (child) | Minimal change disease, steroids |
| Wilms vs neuroblastoma | Wilms: flank mass, aniridia/WAGR. Neuroblastoma: crosses midline, high urine VMA/HVA, opsoclonus-myoclonus |
| ALL | Most common childhood cancer. t(12;21) = good prognosis |
| CAH (21-OH) | Salt wasting, ambiguous genitalia in girls, high 17-OHP |
| Congenital hypothyroidism | Screen at birth, levothyroxine early |
| PKU | Low-phenylalanine diet |
| Cystic fibrosis | Sweat chloride >60, meconium ileus, pancreatic insufficiency |
| Fragile X | Most common inherited intellectual disability |
| Dehydration | Mild/moderate: ORS. Severe: IV isotonic bolus |
| Milestones | Social smile 2 mo, sits 6 mo, walks and first words 12 mo, 2-word phrases 24 mo |

## 3. Traps and quick rules
- **Aspirin in kids:** avoid (Reye), except Kawasaki.
- **Honey under 1 year:** infant botulism.
- **Antibiotics for croup, bronchiolitis, viral URI:** no.
- **Epiglottitis:** do not examine the throat or agitate the child. Airway first.
- **Febrile seizure:** do not start antiepileptics or order EEG/CT.
- **LP with signs of raised ICP:** image first.
- **Pyloric stenosis:** fix electrolytes before surgery.
- **Neonatal sepsis organisms:** GBS, E. coli, Listeria. Ampicillin covers Listeria; ceftriaxone does not.

## 4. Pattern shortcuts
- Preterm + respiratory distress + ground-glass → RDS.
- Term C-section baby + tachypnea that clears in 24-72h → TTN.
- Bilious vomiting in a newborn → malrotation/volvulus (upper GI contrast).
- Cyanosis at birth + egg on a string → TGA.
- Barking cough + stridor → croup. Drooling + toxic → epiglottitis.
- Currant-jelly stool + colicky pain + lethargy → intussusception.
- Child + abdominal mass + hematuria/hypertension → Wilms.
- Spiral fractures, posterior rib fractures, retinal hemorrhage, inconsistent history → abuse.

## 5. If you only remember 7 things
1. Age drives the diagnosis and organism.
2. Bilious vomiting in a newborn = emergency, think volvulus.
3. Neonatal sepsis: ampicillin + gentamicin.
4. Kawasaki: IVIG + aspirin, check coronaries.
5. Pyloric stenosis: alkalosis, fix fluids, then surgery.
6. Croup: dexamethasone. Epiglottitis: airway first.
7. Simple febrile seizure needs no workup or treatment.

**Estimated:** neonatology, congenital heart disease and infections are probably the heaviest areas. I didn't include the national vaccine schedule because it changes; check the current Iranian EPI schedule.

</script>
</section>

<section data-title="Surgery">
<script type="text/markdown">
# Surgery: high-yield

**Known** = standard textbook/guideline facts. **Estimated** = my judgment of exam frequency.
**Sources:** Schwartz's Principles of Surgery, Bailey & Love, ATLS 10e, from my training knowledge (not looked up live).

## 1. Decision rules
- **Unstable + trauma:** ABCDE, FAST, then OR. **Stable:** CT.
- Peritonitis, free air or strangulation means operate now. No more imaging.
- Hemodynamically stable solid organ injury (spleen, liver) is managed non-operatively.
- Tension pneumothorax is a clinical diagnosis. Decompress first, X-ray never.
- "Most common" questions: pick the classic (adhesions for SBO, papillary for thyroid cancer).

## 2. Highest-yield facts

| Topic | Fact |
|---|---|
| Hemorrhagic shock | Hypotension appears at class III (30-40% loss). Crystalloid, then blood early. TXA within 3 h |
| Massive hemothorax | >1500 mL initial or >200 mL/h → thoracotomy |
| Tamponade | Beck triad. Pericardiocentesis or thoracotomy |
| Burns | Parkland: 4 mL × kg × %TBSA, half in the first 8 h from time of burn. Inhalation injury: intubate early |
| Epidural vs subdural | Epidural: lens-shaped, lucid interval, middle meningeal artery. Subdural: crescent, bridging veins, elderly |
| Head injury | GCS ≤8 → intubate |
| Appendicitis | Clinical (Alvarado) ± US (children, pregnancy) or CT. Appendectomy |
| Cholecystitis | US (stones, wall thickening, Murphy). Lap chole within 72 h |
| Cholangitis | Charcot (fever, jaundice, RUQ pain); Reynolds adds shock and confusion. Antibiotics + ERCP drainage |
| Acute pancreatitis | Lipase >3× normal. Ringer's lactate, early feeding. ERCP only if cholangitis/obstruction. Pseudocyst >6 wk and >6 cm: drain |
| Painless jaundice + palpable GB | Pancreatic head cancer (Courvoisier). CT, Whipple |
| SBO | Adhesions most common. Partial: NPO, NG tube, fluids. Strangulation/complete: surgery |
| Sigmoid volvulus | Coffee-bean sign. Endoscopic decompression, then elective resection |
| Mesenteric ischemia | Pain out of proportion to exam (AF, embolus). CTA, laparotomy |
| Diverticulitis | LLQ pain, CT. Uncomplicated: antibiotics. Abscess >4 cm: drain. Perforation with peritonitis: Hartmann |
| Upper GI bleed | PPI, endoscopy within 24 h |
| Hernia | Indirect inguinal most common. Femoral (women): highest strangulation risk |
| Boerhaave | Vomiting + chest pain + mediastinitis. Contrast esophagram, surgery |
| Achalasia | Bird's beak. Manometry is diagnostic |
| Thyroid nodule | TSH, US, FNA. Papillary: most common, nodal spread. Follicular: needs capsular/vascular invasion (FNA can't diagnose). Medullary: calcitonin, MEN2/RET. Anaplastic: worst |
| Post-thyroidectomy | Perioral numbness, Chvostek → IV calcium gluconate. Hoarseness → recurrent laryngeal nerve |
| Primary hyperparathyroidism | High Ca + high PTH. Sestamibi, parathyroidectomy |
| Breast mass | Triple assessment (exam, imaging, core biopsy). Sentinel node if axilla clinically negative |
| Breast cancer drugs | ER+ premenopausal: tamoxifen. Postmenopausal: aromatase inhibitor. HER2+: trastuzumab |
| Colorectal | FAP: APC, prophylactic colectomy. Lynch: MMR. CEA is for follow-up, not screening |
| Anal fissure | Posterior midline, pain on defecation. Topical nitrate/diltiazem |
| AAA | Elective repair at ≥5.5 cm. Ruptured: straight to OR |
| Acute limb ischemia | 6 Ps. Heparin + embolectomy |
| Carotid | Symptomatic ≥70% stenosis → endarterectomy |
| Compartment syndrome | Pain on passive stretch → fasciotomy |
| Post-op fever | Wind (atelectasis, day 1-2), Water (UTI, day 3), Wound (day 5-7), Walking (DVT). Wound infection <48 h suggests strep/clostridia |

## 3. Traps and quick rules
- **CT in an unstable trauma patient:** no. FAST, then OR.
- **Waiting for X-ray in tension pneumothorax:** decompress immediately.
- **Removing an impaled object in the ED:** leave it, remove in the OR.
- **Biliary pancreatitis → ERCP:** only with cholangitis or persistent obstruction.
- **Pregnancy with suspected appendicitis:** US first, then MRI. Don't withhold surgery.
- **Lower rib fractures:** think spleen (left) or liver (right).
- **FNA for follicular thyroid cancer:** can't diagnose it.
- **Post-splenectomy:** vaccinate against encapsulated organisms.

## 4. Pattern shortcuts
- Hypotension + distended neck veins + muffled heart sounds → tamponade.
- Hypotension + absent breath sounds + tracheal deviation → tension pneumothorax.
- Pulsatile abdominal mass + back pain + hypotension → ruptured AAA.
- Fever + jaundice + RUQ pain → cholangitis.
- Vomiting + subcutaneous emphysema + chest pain → Boerhaave.
- Elderly + AF + severe abdominal pain with a soft abdomen → mesenteric ischemia.
- Lucid interval after head trauma → epidural hematoma.

## 5. If you only remember 7 things
1. Unstable: FAST and OR. Stable: CT.
2. Peritonitis or free air: operate, no more imaging.
3. Tension pneumothorax: decompress clinically.
4. Parkland: 4 × kg × %TBSA, half in the first 8 h.
5. Cholangitis: antibiotics + ERCP. Cholecystitis: lap chole within 72 h.
6. Thyroid nodule: TSH, US, FNA. Papillary is most common.
7. Strangulated hernia, volvulus with ischemia, ruptured AAA: emergency surgery.

**Estimated:** trauma, acute abdomen and GI surgery are probably the heaviest parts. I haven't included orthopedics or urology here, since they come later in the order.
</script>
</section>

<section data-title="OB/GYN">
<script type="text/markdown">
# OB/GYN: high-yield

**Known** = standard textbook/guideline facts. **Estimated** = my judgment of exam frequency.
**Sources:** Williams Obstetrics 26e, Berek & Novak, ACOG/CDC guidelines, from my training knowledge (not looked up live).

## 1. Decision rules
- Any woman of reproductive age with pain, bleeding or amenorrhea: **hCG first**.
- Third-trimester bleeding: **ultrasound before any vaginal exam**.
- Unstable + positive hCG + pelvic pain = ruptured ectopic. Go to surgery.
- Postmenopausal bleeding = endometrial cancer until proven otherwise. Do an endometrial biopsy.
- Pregnancy drug choices: avoid ACEi/ARB, warfarin, isotretinoin, tetracyclines, valproate, statins. Use heparin instead of warfarin.

## 2. Highest-yield facts

| Topic | Fact |
|---|---|
| Ectopic | hCG above the discriminatory zone (~1500-3500) with no intrauterine sac on TVUS. Methotrexate if stable, unruptured, no fetal heartbeat, hCG <5000. Otherwise laparoscopy |
| Placenta previa | Painless bright-red bleeding. No digital exam. C-section |
| Abruption | Painful, dark blood, rigid uterus. Risks: HTN, cocaine, trauma. Complication: DIC |
| Vasa previa | Bleeding at rupture of membranes + fetal bradycardia. Emergency C-section |
| Preeclampsia | BP ≥140/90 after 20 wk + proteinuria or end-organ damage. Severe: ≥160/110. Delivery is definitive |
| Eclampsia | MgSO₄ (loss of patellar reflex first sign of toxicity, antidote calcium gluconate) |
| Antihypertensives in pregnancy | Labetalol, nifedipine, methyldopa, hydralazine |
| HELLP | Hemolysis, high LFTs, low platelets. Deliver |
| GDM | Screen at 24-28 wk. Diet, then insulin (metformin is an alternative) |
| Preterm labor | Steroids 24-34 wk, MgSO₄ if <32 wk (neuroprotection), tocolysis (nifedipine) only to allow steroids, GBS prophylaxis |
| PPROM | Antibiotics + steroids. Deliver at 34 wk |
| Postpartum hemorrhage | Atony is most common. Massage, oxytocin, then methylergonovine (not in HTN) or carboprost (not in asthma), TXA. Then balloon, B-Lynch, hysterectomy |
| Rh-negative mother | Anti-D at 28 wk and within 72 h of delivery |
| Molar pregnancy | Snowstorm on US, very high hCG, hyperthyroidism, hyperemesis. Suction curettage, follow hCG. Invasive disease/choriocarcinoma: methotrexate |
| Prenatal screening | NT at 11-14 wk. High AFP: neural tube defect. Down: low AFP, high hCG, low estriol, high inhibin |
| Infections | Syphilis: penicillin. HIV: ART, C-section if viral load >1000. HBV: HBIG + vaccine to the neonate |
| Fetal heart tracing | Early decel: benign. Variable: cord compression. Late: uteroplacental insufficiency |
| Shoulder dystocia | McRoberts + suprapubic pressure |
| Cord prolapse | Elevate presenting part, knee-chest, emergency C-section |
| Cervical screening | Start at 21. 21-29: cytology q3y. 30-65: cytology+HPV q5y. CIN 2-3: LEEP |
| Cervical cancer | HPV 16/18. Early stage: surgery. IIB or higher: chemoradiation |
| Endometrial cancer | Unopposed estrogen, obesity. TVUS thickness >4 mm in postmenopause → biopsy |
| Ovarian tumors | Epithelial serous most common (CA-125, BRCA). Dysgerminoma: LDH. Granulosa: Call-Exner bodies, estrogen. Sertoli-Leydig: virilization. Krukenberg: GI primary |
| Ovarian torsion | Sudden unilateral pain. Doppler. Detorsion surgery |
| PCOS | 2 of 3: oligo-anovulation, hyperandrogenism, polycystic ovaries. OCP for cycles/hirsutism, letrozole for fertility |
| Amenorrhea | hCG, then TSH, prolactin, FSH |
| Primary amenorrhea | Turner: high FSH. MRKH: normal breasts, absent uterus, 46XX. AIS: 46XY, scant pubic hair |
| Asherman / Sheehan | Asherman: after curettage. Sheehan: postpartum hemorrhage, failed lactation |
| Endometriosis | Dysmenorrhea, dyspareunia, chocolate cyst. Laparoscopy is gold standard. NSAIDs + hormonal therapy |
| Fibroids | Most common benign tumor. Heavy bleeding. Red degeneration in pregnancy |
| Adenomyosis | Boggy tender uterus. MRI. Hysterectomy is definitive |
| PID | Ceftriaxone + doxycycline + metronidazole. Complication: Fitz-Hugh-Curtis |
| Vaginitis | BV: clue cells, pH >4.5, whiff test, metronidazole. Candida: curds, normal pH, fluconazole. Trichomonas: motile organisms, treat partner |
| Contraception | Estrogen contraindicated: migraine with aura, smoker >35, VTE, breast cancer, liver disease. Emergency: copper IUD best, then ulipristal, then levonorgestrel |
| Menopause | HRT for vasomotor symptoms. Add progestin if uterus present |
| Infertility | Semen analysis first. HSG for tubes |
| Recurrent miscarriage | Antiphospholipid syndrome: aspirin + heparin |
| Postpartum | Endometritis: clindamycin + gentamicin. Mastitis: keep breastfeeding. Blues <2 wk. Depression longer. Psychosis: emergency |

## 3. Traps and quick rules
- **Vaginal exam in third-trimester bleeding:** ultrasound first.
- **Methylergonovine in hypertension, carboprost in asthma:** contraindicated.
- **MgSO₄ toxicity:** check reflexes. Give calcium gluconate.
- **Warfarin in pregnancy:** use heparin.
- **Magnesium vs antihypertensives:** magnesium prevents seizures, it doesn't lower BP.
- **Ectopic with a heartbeat or instability:** surgery, not methotrexate.
- **Postmenopausal bleeding:** biopsy, don't just treat with hormones.
- **Tocolytics:** they buy time for steroids. They don't prevent preterm birth.

## 4. Pattern shortcuts
- Painless bright bleeding in the third trimester → previa.
- Painful dark bleeding + rigid uterus → abruption.
- Missed period + unilateral pain + hCG rising slowly → ectopic.
- Hypertension + headache + proteinuria after 20 wk → preeclampsia.
- Large-for-dates uterus + very high hCG + snowstorm → molar pregnancy.
- Short stature + primary amenorrhea + high FSH → Turner.
- Primary amenorrhea + normal breasts + absent uterus → MRKH.
- Cyclic pain + chocolate cyst + infertility → endometriosis.

## 5. If you only remember 7 things
1. hCG first in any reproductive-age woman.
2. Ultrasound before vaginal exam in late-pregnancy bleeding.
3. Preeclampsia: MgSO₄ for seizures, labetalol/nifedipine for BP, delivery cures it.
4. Preterm: steroids at 24-34 wk, MgSO₄ if <32 wk.
5. Postpartum hemorrhage: atony first, then massage + oxytocin.
6. Postmenopausal bleeding → endometrial biopsy.
7. Rh-negative: anti-D at 28 wk and within 72 h.

**Estimated:** obstetric emergencies, hypertensive disorders and gynecologic oncology are probably the heaviest parts.
</script>
</section>

<section data-title="Neurology + Psychiatry">
<script type="text/markdown">
# Neurology + Psychiatry: high-yield

**Known** = standard textbook/guideline facts. **Estimated** = my judgment of exam frequency.
**Sources:** Adams & Victor, Harrison's 21e, AAN/AHA-ASA guidelines, Kaplan & Sadock, DSM-5-TR, from my training knowledge (not looked up live).

## 1. Decision rules
- **Neurology:** localize first (UMN vs LMN, cortex vs brainstem vs cord vs nerve vs NMJ vs muscle), then pick the diagnosis.
- Acute focal deficit: **non-contrast CT first** to exclude hemorrhage.
- Signs of raised ICP or focal deficit with suspected meningitis: give antibiotics, then image, then LP. Never delay antibiotics.
- Thiamine before glucose in alcoholics.
- **Psychiatry:** exclude organic or substance causes first, then match duration criteria.
- Suicidal plan or intent means admit. Always ask directly.
- First-line: SSRI for depression/anxiety/OCD, lithium for bipolar, atypical antipsychotic for psychosis.

## 2. Highest-yield facts: Neurology

| Topic | Fact |
|---|---|
| Ischemic stroke | CT, then tPA if within 4.5 h and BP <185/110. Thrombectomy for large-vessel occlusion (up to 24 h in selected patients). Aspirin after 24 h. Carotid stenosis ≥70% symptomatic: endarterectomy |
| ICH | BP control, reverse anticoagulation |
| SAH | Thunderclap headache. CT, then LP (xanthochromia) if CT negative. Nimodipine, coil/clip. ADPKD link |
| Epidural/subdural | See Surgery |
| Bacterial meningitis | Ceftriaxone + vancomycin + dexamethasone. Add ampicillin if >50 y or neonate (Listeria) |
| HSV encephalitis | Temporal lobe, acyclovir immediately |
| Status epilepticus | IV lorazepam, then levetiracetam/valproate/phenytoin |
| Absence | 3 Hz spike-wave, ethosuximide |
| JME | Valproate (levetiracetam in women of childbearing age) |
| Focal epilepsy | Carbamazepine or lamotrigine |
| Infantile spasms | Hypsarrhythmia, ACTH/vigabatrin, think tuberous sclerosis |
| MS | Periventricular lesions, oligoclonal bands, INO. Relapse: IV methylprednisolone |
| Parkinson | Resting tremor, rigidity, bradykinesia. Levodopa/carbidopa. Young: dopamine agonist |
| Lewy body | Dementia + visual hallucinations + parkinsonism |
| Alzheimer | Cholinesterase inhibitor ± memantine |
| NPH | Wet, wobbly, wacky. Shunt |
| Myasthenia gravis | Anti-AChR, fatigable ptosis. CT chest (thymoma). Pyridostigmine. Crisis: IVIG/plasmapheresis |
| LEMS | Small cell lung cancer, improves with use |
| GBS | Ascending weakness, areflexia, albuminocytologic dissociation. IVIG or plasmapheresis, monitor FVC, no steroids |
| ALS | UMN + LMN signs, no sensory loss. Riluzole |
| Migraine | Triptans acute. Prophylaxis: propranolol/topiramate |
| Cluster headache | 100% O₂, sumatriptan. Verapamil prophylaxis |
| Trigeminal neuralgia | Carbamazepine |
| Cord syndromes | Cauda equina: emergency MRI + surgery. Brown-Séquard: ipsilateral motor/proprioception loss, contralateral pain/temp loss. Syringomyelia: cape-like pain/temp loss. B12: dorsal columns + corticospinal |
| Brain tumors | Adults: metastasis most common; GBM most common primary. Children: medulloblastoma, pilocytic astrocytoma (posterior fossa). Craniopharyngioma: bitemporal hemianopia |
| Localization | MCA: contralateral face/arm weakness, aphasia (dominant). ACA: leg weakness. PCA: homonymous hemianopia, macular sparing. Wallenberg (PICA): ipsilateral face + contralateral body pain/temp loss, Horner, dysphagia |
| Wernicke | Confusion, ataxia, ophthalmoplegia. IV thiamine |

## 3. Highest-yield facts: Psychiatry

| Topic | Fact |
|---|---|
| Psychosis timeline | <1 mo: brief psychotic. 1-6 mo: schizophreniform. ≥6 mo: schizophrenia |
| Schizophrenia | Atypical antipsychotic. Treatment-resistant: clozapine (agranulocytosis, myocarditis, seizures; monitor CBC) |
| Antipsychotic reactions | Acute dystonia: benztropine. Akathisia: propranolol. NMS: fever, rigidity, high CK; stop drug, dantrolene/bromocriptine. Tardive dyskinesia: valbenazine |
| Serotonin syndrome | Clonus, hyperreflexia, diarrhea. Cyproheptadine |
| Bipolar | Mania ≥1 week. Lithium first-line. Toxicity: tremor, nephrogenic DI, hypothyroidism. Avoid with NSAIDs, thiazides, ACEi. Ebstein anomaly. Valproate teratogenic |
| MDD | SSRI (4-6 wk to full effect). ECT for psychotic depression, catatonia, high suicide risk. Bupropion: avoid in seizures/bulimia. Mirtazapine for insomnia/poor appetite |
| MAOI | Tyramine → hypertensive crisis. Never combine with SSRIs |
| GAD / panic | SSRI/SNRI + CBT. Benzodiazepines short-term only |
| OCD | High-dose SSRI + exposure and response prevention |
| PTSD | >1 month (<1 month: acute stress disorder). Trauma CBT, SSRI. Prazosin for nightmares |
| Personality disorders | A odd, B dramatic, C anxious. Borderline: DBT |
| Alcohol withdrawal | Benzodiazepines (lorazepam in liver disease). DTs at 48-96 h. Thiamine |
| Opioids | Overdose: naloxone. Maintenance: methadone/buprenorphine. Withdrawal symptoms: clonidine |
| Eating disorders | Anorexia: refeeding syndrome risk. Bulimia: fluoxetine, avoid bupropion |
| ADHD | Stimulants first-line |
| Delirium vs dementia | Delirium: acute, fluctuating, inattention. Find and treat the cause. Low-dose haloperidol if needed |
| Somatic disorders | Conversion: neurologic symptom, normal exam. Factitious: sick role. Malingering: external gain |

## 4. Traps and quick rules
- **LP before imaging with raised ICP signs:** image first, but don't delay antibiotics.
- **Steroids in GBS:** no benefit. Use IVIG or plasmapheresis.
- **Glucose before thiamine in alcoholics:** thiamine first.
- **tPA beyond 4.5 h or with hemorrhage on CT:** contraindicated.
- **Lithium with NSAIDs/thiazides/ACEi:** raises levels, causing toxicity.
- **SSRI plus MAOI or tramadol:** serotonin syndrome.
- **Antidepressant alone in bipolar depression:** risks triggering mania.
- **Benzodiazepine for chronic anxiety:** SSRI is first-line.
- **Duration criteria:** psychosis 1/6 months, PTSD 1 month, mania 1 week. They separate similar diagnoses.

## 5. Pattern shortcuts
- Worst headache of life + thunderclap onset → SAH.
- Ascending weakness + areflexia after diarrhea → GBS.
- Ptosis + diplopia worse at day's end → myasthenia.
- Resting tremor + bradykinesia + shuffling → Parkinson.
- Fever + headache + neck stiffness + photophobia → meningitis.
- Fever + bizarre behavior + seizures + temporal lobe lesion → HSV encephalitis.
- Dementia + incontinence + gait disturbance → NPH.
- Fever + rigidity + high CK after antipsychotic → NMS.
- Agitation + clonus + diarrhea after a new serotonergic drug → serotonin syndrome.

## 6. If you only remember 7 things
1. Acute stroke: CT first, then tPA within 4.5 h.
2. Meningitis: ceftriaxone + vancomycin + dexamethasone, don't delay.
3. Status epilepticus: benzodiazepine first.
4. GBS: IVIG or plasmapheresis, no steroids.
5. SSRI is first-line for depression/anxiety/OCD. Lithium for bipolar, watch levels and interactions.
6. Know the antipsychotic complications (dystonia, akathisia, NMS, TD, clozapine).
7. Alcohol withdrawal: benzodiazepines + thiamine.

**Estimated:** stroke, epilepsy, neuromuscular disease, mood/psychotic disorders and drug adverse effects are probably the heaviest parts.

</script>
</section>

<section data-title="Infectious Disease + Dermatology">
<script type="text/markdown">
# Infectious Disease + Dermatology: high-yield

**Known** = standard textbook/guideline facts. **Estimated** = my judgment of exam frequency.
**Sources:** Harrison's 21e, Mandell, IDSA/CDC/WHO guidelines, Fitzpatrick's and Bolognia's dermatology texts, from my training knowledge (not looked up live).

## 1. Decision rules
- **Cultures first, then antibiotics, within 1 h** in sepsis. Never delay antibiotics for imaging or LP.
- Match **organism to site and host**: IV drug use (S. aureus), alcoholic (Klebsiella), cystic fibrosis (Pseudomonas), asplenia (encapsulated organisms), neutropenia (Pseudomonas, fungi).
- **Narrow the antibiotic** once culture results return.
- Derm: **describe the primary lesion first** (macule, papule, plaque, vesicle, bulla, pustule). Then check distribution, then use biopsy/IF.
- Blisters: **where is the split** (intraepidermal vs subepidermal) answers most questions.

## 2. Highest-yield facts: Infectious disease

| Topic | Fact |
|---|---|
| HIV | Start ART in everyone. CD4 <200: TMP-SMX (PJP). <100: toxoplasma prophylaxis. <50: MAC (azithromycin) |
| PJP | Bilateral interstitial infiltrates, high LDH. TMP-SMX. Add steroids if PaO₂ <70 |
| Cryptococcal meningitis | India ink/CrAg. Amphotericin B + flucytosine |
| Toxoplasmosis | Ring-enhancing brain lesions. Pyrimethamine + sulfadiazine |
| TB | Treat with RIPE for 2 mo, then RI for 4 mo. Give pyridoxine with INH. Diagnosis: sputum AFB, GeneXpert. Latent TB: INH 9 mo or rifampin 4 mo |
| TB drug toxicity | INH: hepatitis, neuropathy. Rifampin: orange secretions, CYP inducer. PZA: hyperuricemia. Ethambutol: optic neuritis |
| CAP | Outpatient: amoxicillin or doxycycline. Inpatient: β-lactam + macrolide |
| CAP organisms | Legionella: hyponatremia, diarrhea, urine antigen. Mycoplasma: young, cold agglutinins. Klebsiella: alcoholics, currant-jelly sputum. Staph: post-influenza |
| UTI | Nitrofurantoin for simple cystitis. Pyelonephritis: ceftriaxone/FQ. Asymptomatic bacteriuria: **treat only in pregnancy** (or before urologic procedures) |
| Endocarditis | Strep viridans (dental, damaged valve), S. aureus (IVDU, tricuspid), S. bovis (colon cancer). Duke criteria. Blood cultures ×3 before antibiotics |
| Osteomyelitis | S. aureus most common. Sickle cell: Salmonella. Puncture wound through shoe/IVDU: Pseudomonas |
| C. difficile | Oral vancomycin or fidaxomicin |
| Syphilis | Benzathine penicillin G (neurosyphilis: IV penicillin). Jarisch-Herxheimer reaction after treatment |
| Gonorrhea / chlamydia | Ceftriaxone / doxycycline |
| Infectious mononucleosis | EBV, heterophile Ab, atypical lymphocytes. Avoid ampicillin (rash) and contact sports (splenic rupture) |
| CMV | Ganciclovir |
| Mucormycosis | DKA, black eschar, nasal/orbital. Amphotericin B + debridement |
| Aspergillus | Voriconazole |
| Typhoid | Rose spots, relative bradycardia. Ceftriaxone or azithromycin |
| Cholera | Rehydration is the treatment |
| Malaria | Severe falciparum: IV artesunate. Vivax/ovale: add primaquine for hypnozoites after G6PD check |
| Needle-stick | HBV (vaccinate/HBIG), HCV (no PEP, follow up), HIV (PEP within 72 h) |
| Hepatitis B serology | HBsAg = infection. Anti-HBs alone = vaccinated or immune. Anti-HBc IgM = window period |
| Brucellosis (Iran-endemic) | Raw dairy, undulant fever, sacroiliitis/spondylitis. Doxycycline + rifampin ×6 wk (or + aminoglycoside) |
| Hydatid cyst (Iran-endemic) | Dog contact, liver cyst with daughter cysts. Albendazole + PAIR or surgery. Avoid spillage |
| Rabies | Wash wound. Category III exposure: vaccine + rabies immunoglobulin |
| CCHF (Iran-endemic) | Tick bite or slaughterhouse, hemorrhage, thrombocytopenia. Supportive care, ribavirin |
| Tetanus | Unvaccinated + dirty wound: Td + TIG, wound debridement. Disease: metronidazole, benzodiazepines |

## 3. Highest-yield facts: Dermatology

| Topic | Fact |
|---|---|
| Melanoma | ABCDE. **Breslow depth** is the key prognostic factor. Excisional biopsy with narrow margins, then wide excision by depth |
| BCC | Most common skin cancer. Pearly, rolled borders, telangiectasia. Mohs on the face |
| SCC | Sun-exposed, keratotic. Precursor: actinic keratosis. Higher risk in transplant patients |
| Psoriasis | Silvery plaques on extensors, Auspitz sign, Koebner phenomenon, nail pitting. Guttate follows strep. Mild: topical steroid + vitamin D. Severe: methotrexate/biologics |
| Atopic dermatitis | Flexural in adults, itchy. Emollients + topical steroids |
| Pemphigus vulgaris | Flaccid bullae, **intraepidermal**, Nikolsky positive, anti-desmoglein, IF: "fishnet" |
| Bullous pemphigoid | Elderly, tense bullae, **subepidermal**, anti-BP180, IF: linear |
| Dermatitis herpetiformis | Celiac link, granular IgA in papillary tips. Dapsone + gluten-free diet |
| SJS/TEN | Drugs (allopurinol, carbamazepine, sulfa, lamotrigine). <10% BSA SJS, >30% TEN. Stop drug, supportive care |
| Staph scalded skin | Children, exfoliative toxin, Nikolsky positive. Anti-staphylococcal antibiotic |
| Erythema multiforme / nodosum | EM: target lesions (HSV, Mycoplasma). EN: tender shin nodules (strep, TB, sarcoid, IBD) |
| Acne | Mild: retinoid/benzoyl peroxide. Moderate: add antibiotic. Severe: isotretinoin (teratogenic, pregnancy test) |
| Urticaria / angioedema | Antihistamines. ACEi angioedema: bradykinin-mediated, no response to antihistamines |
| Tinea | KOH prep. Nails: terbinafine. Tinea capitis: griseofulvin. Tinea versicolor: selenium sulfide |
| Scabies | Nocturnal itch, burrows. Permethrin, treat all contacts. Ivermectin alternative |
| Impetigo | Honey-crusted. Mupirocin |
| Cellulitis / necrotizing fasciitis | Cellulitis: strep, antibiotics. Necrotizing: pain out of proportion, crepitus. Emergency surgery + broad antibiotics |
| Herpes zoster | Valacyclovir within 72 h. Postherpetic neuralgia: gabapentin/TCA |
| Lichen planus | 6 Ps, Wickham striae. Hepatitis C link |
| Pityriasis rosea | Herald patch, Christmas-tree pattern, self-limited |
| Dermatomyositis | Heliotrope rash, Gottron papules. Screen for malignancy |
| Acanthosis nigricans | Insulin resistance. Sudden onset in an adult: GI malignancy |
| Cutaneous leishmaniasis (Iran-endemic) | Chronic painless ulcer after sandfly bite. Intralesional or systemic antimonials |

## 4. Traps and quick rules
- **Ampicillin in mononucleosis:** rash. Avoid it.
- **Treating asymptomatic bacteriuria:** only in pregnancy.
- **INH without pyridoxine:** neuropathy.
- **Dapsone/primaquine without a G6PD check:** hemolysis.
- **Pemphigus vs pemphigoid:** pemphigus is flaccid and Nikolsky positive. Pemphigoid is tense and subepidermal.
- **Systemic steroids in psoriasis:** can cause rebound pustular flare. Avoid them.
- **Potent topical steroids on face and folds:** avoid them.
- **Delaying antibiotics in suspected meningitis or sepsis for tests:** don't.
- **Empiric treatment of S. bovis endocarditis:** also look for colon cancer.

## 5. Pattern shortcuts
- Fever + new murmur + IVDU → S. aureus endocarditis (tricuspid).
- Night sweats + weight loss + cavitary apical lesion → TB.
- Undulant fever + raw cheese/milk + sacroiliitis → brucellosis.
- Immunocompromised + bilateral infiltrates + high LDH → PJP.
- Ring-enhancing lesions + low CD4 → toxoplasmosis.
- DKA + black nasal eschar → mucormycosis.
- Painful dermatomal vesicles → zoster.
- Target lesions after HSV/drug → EM. Mucosal + epidermal sloughing after drug → SJS/TEN.
- Flaccid bullae + oral erosions → pemphigus vulgaris.
- Tense bullae in an elderly patient → bullous pemphigoid.
- Pearly papule on the face → BCC.

## 6. If you only remember 7 things
1. Cultures, then antibiotics within 1 h in sepsis. Never delay for imaging.
2. CD4 thresholds: 200 (PJP), 100 (toxo), 50 (MAC). Start ART in everyone.
3. TB: RIPE ×2 mo, then RI ×4 mo, with pyridoxine.
4. Brucella: doxycycline + rifampin ×6 wk. Know the Iran-endemic diseases (brucellosis, hydatid, CCHF, leishmaniasis, rabies).
5. Pemphigus (intraepidermal, flaccid) vs pemphigoid (subepidermal, tense).
6. SJS/TEN: stop the drug, supportive care. Necrotizing fasciitis: emergency surgery.
7. Melanoma: Breslow depth decides prognosis. BCC is the most common skin cancer.

**Estimated:** HIV/opportunistic infections, TB, endemic Iranian infections, antibiotic selection, bullous disorders and skin cancers are probably the heaviest areas. The Iran-endemic emphasis is my inference, not a verified syllabus weight. Check the Sanjesh syllabus.

</script>
</section>

<section data-title="ENT, Ophthalmology, Orthopedics, Urology, Radiology">
<script type="text/markdown">
# ENT, Ophthalmology, Orthopedics, Urology, Radiology: high-yield

**Known** = standard textbook/guideline facts. **Estimated** = my judgment of exam frequency.
**Sources:** Cummings Otolaryngology, AAO BCSC/Kanski, Apley/Campbell's Orthopaedics, Campbell-Walsh Urology, ACR Appropriateness Criteria, Brant & Helms. These are from my training knowledge, not looked up live.

## 1. Decision rules
- **Painless sudden vision loss** is a vascular emergency. **Painful red eye with a mid-dilated pupil** is angle closure.
- **Neurovascular compromise or an open fracture** means urgent surgery. Check pulses and nerves before and after any reduction.
- **Testicular torsion** is an emergency. Don't wait for imaging if suspicion is high.
- **Adult neck mass or painless hematuria** is cancer until proven otherwise (neck: FNA, not open biopsy; hematuria: cystoscopy + CT urography).
- **Radiology:** choose the modality by organ and urgency. Avoid ionizing radiation in pregnancy and children when US/MRI answers the question.

## 2. ENT

| Topic | Fact |
|---|---|
| Epistaxis | Anterior (Kiesselbach): lean forward and pinch 10-15 min, then topical vasoconstrictor, cautery, packing. Teen boy with unilateral epistaxis + nasal mass: juvenile angiofibroma. Don't biopsy |
| Otitis media | Amoxicillin. Otitis externa: topical quinolone |
| Malignant otitis externa | Diabetic, Pseudomonas, granulation tissue. Anti-pseudomonal antibiotics |
| Hearing loss | Rinne/Weber. Otosclerosis: conductive, young woman, Carhart notch, stapedectomy. Noise-induced: 4 kHz notch |
| Sudden SNHL | Urgent oral steroids. MRI to exclude schwannoma |
| Vertigo | BPPV: Dix-Hallpike, Epley. Ménière: vertigo + tinnitus + hearing loss + aural fullness, low-salt diet. Vestibular neuritis: no hearing loss. Schwannoma: unilateral SNHL, bilateral in NF2 |
| Bell palsy | Forehead involved (LMN). Steroids within 72 h. Forehead spared = central lesion |
| Neck/head tumors | Laryngeal: smoker + hoarseness >2-3 wk → laryngoscopy. Nasopharyngeal: EBV, unilateral serous otitis in an adult, cervical node. Parotid: pleomorphic adenoma most common (superficial parotidectomy); Warthin bilateral in smokers; mucoepidermoid most common malignant |
| Peritonsillar abscess | Trismus, uvular deviation. Drainage + antibiotics |
| Retropharyngeal abscess | Child, widened prevertebral space on lateral neck film |
| Sinusitis | Antibiotics only if >10 days or double worsening. Orbital cellulitis: CT + IV antibiotics |
| Foreign body | Button battery in nose/esophagus: emergency removal |

## 3. Ophthalmology

| Topic | Fact |
|---|---|
| Acute angle-closure | Pain, halos, hard eye, fixed mid-dilated pupil. Acetazolamide + timolol + pilocarpine, then laser iridotomy. Avoid mydriatics |
| Open-angle glaucoma | Most common, painless, cupping. Prostaglandin analog first |
| CRAO | Painless, cherry-red spot. Emergency |
| CRVO | "Blood and thunder" retina |
| Retinal detachment | Flashes, floaters, curtain. Surgery |
| Giant cell arteritis | Steroids immediately, before biopsy |
| Optic neuritis | Pain on eye movement, RAPD, MS link. IV methylprednisolone |
| Diabetic retinopathy | Proliferative: panretinal photocoagulation/anti-VEGF. Macular edema: anti-VEGF. Screen yearly |
| AMD | Wet: anti-VEGF. Dry: AREDS vitamins |
| Neonatal conjunctivitis | Day 1: chemical. Day 2-5: gonococcal (ceftriaxone). Day 5-14: chlamydia (oral erythromycin) |
| Keratitis | Contact lens: Pseudomonas. HSV: dendritic ulcer, acyclovir. No steroids before the cause is known |
| Chemical burn | Irrigate immediately, before anything else |
| Uveitis | HLA-B27/ankylosing spondylitis. Steroid drops + cycloplegic |
| Leukocoria | Retinoblastoma until proven otherwise (RB1) |
| Pupils/nerves | Horner: ptosis, miosis, anhidrosis. CN III compressive: down-and-out + dilated pupil (PCOM aneurysm). Diabetic CN III: pupil spared |
| Papilledema | Bilateral. IIH: obese young woman, acetazolamide |
| Drug toxicity | Ethambutol: optic neuropathy. Hydroxychloroquine: retinopathy |

## 4. Orthopedics

| Topic | Fact |
|---|---|
| Open fracture | Antibiotics (cefazolin ± gentamicin), tetanus, debridement/irrigation, fixation |
| Compartment syndrome | Pain on passive stretch. Fasciotomy |
| Fat embolism | Long-bone fracture, 24-72 h, petechiae + hypoxia + confusion |
| Supracondylar (child) | Brachial artery injury, Volkmann contracture |
| Scaphoid | Snuffbox tenderness, X-ray may be negative. Thumb spica + repeat/MRI. Avascular necrosis |
| Hip fracture (elderly) | Surgery within 24-48 h. Displaced femoral neck: arthroplasty |
| Monteggia / Galeazzi | Monteggia: ulna fracture + radial head dislocation. Galeazzi: radius fracture + DRUJ dislocation |
| Nerve injuries | Humeral shaft: radial. Anterior shoulder dislocation: axillary. Posterior hip dislocation: sciatic. Fibular neck: peroneal (foot drop) |
| Knee | ACL: Lachman/anterior drawer. Meniscus: McMurray. Unhappy triad: ACL + MCL + medial meniscus |
| Pediatric hip | DDH: Ortolani/Barlow, US <4-6 mo, Pavlik harness. SCFE: obese adolescent, hip/knee pain, pinning. Perthes: boy 4-8 y, AVN. Transient synovitis: afebrile, weight-bearing. Septic arthritis: aspirate, washout, antibiotics |
| Bone tumors | Metastasis is most common. Osteosarcoma: metaphysis, Codman triangle, sunburst, RB1/Paget. Ewing: diaphysis, onion skin, t(11;22). Giant cell: epiphysis, soap bubble. Osteoid osteoma: night pain relieved by NSAIDs. Osteochondroma: most common benign |
| Osteoporosis | DEXA T ≤ -2.5. Bisphosphonate |
| Paget | High ALP, normal Ca |
| Back pain | Red flags (cancer, fever, trauma, neuro deficit): MRI. Cauda equina: emergency decompression. L5 root: foot drop. S1: absent ankle jerk |
| Hand/shoulder | Carpal tunnel: median nerve, Tinel/Phalen, night splint. De Quervain: Finkelstein. Frozen shoulder: diabetes. Rotator cuff: supraspinatus |

## 5. Urology

| Topic | Fact |
|---|---|
| Renal colic | Non-contrast CT. <5 mm: passes, tamsulosin for distal stones. Infected obstructed system: emergency decompression (stent/nephrostomy) |
| Stone types | Calcium oxalate most common. Struvite: Proteus, staghorn. Uric acid: radiolucent, alkalinize urine. Cystine: hexagonal |
| BPH | Alpha-blocker. Large prostate: add 5-ARI. Refractory: TURP |
| Prostate cancer | Peripheral zone adenocarcinoma. PSA, then biopsy/MRI. Osteoblastic bone mets. Advanced: ADT |
| Testicular torsion | Adolescent, sudden pain, absent cremasteric reflex, high-riding testis. Surgery within ~6 h, fix both sides |
| Epididymitis | <35: chlamydia/gonorrhea. >35: E. coli. Prehn sign positive |
| Testicular tumor | Painless mass → scrotal US, then **inguinal** orchiectomy (no scrotal biopsy). Seminoma most common, radiosensitive. Yolk sac: AFP. Choriocarcinoma: hCG |
| Cryptorchidism | Orchiopexy at 6-12 mo. Raises cancer risk |
| Varicocele | Left-sided. Sudden right-sided: look for retroperitoneal mass |
| Bladder cancer | Smoking, painless hematuria. Cystoscopy → TURBT. Schistosomiasis: squamous cell |
| RCC | Clear cell, VHL, hematuria + flank pain + mass, polycythemia, IVC extension. Nephrectomy |
| Urethral trauma | Blood at meatus, high-riding prostate: retrograde urethrogram **before** catheter |
| Bladder rupture | Cystogram |
| Pediatrics | PUV: boy, bilateral hydronephrosis, VCUG. Hypospadias: don't circumcise |
| Priapism | Ischemic (sickle cell) is an emergency |
| Incontinence | Stress: pelvic floor exercises/sling. Urge: anticholinergic or mirabegron. Overflow: catheterize |
| Erectile dysfunction | PDE5 inhibitors. Contraindicated with nitrates |

## 6. Radiology

| Question | Best test |
|---|---|
| Stable blunt trauma / acute stroke / SAH | CT (non-contrast for stroke and SAH) |
| Appendicitis in child/pregnancy; cholecystitis; testicular; thyroid nodule | Ultrasound |
| Brain/cord tumors, MS, osteomyelitis, occult scaphoid fracture, prostate | MRI |
| PE | CTPA (V/Q if renal failure or pregnancy) |
| Aortic dissection | CTA (TEE if unstable) |
| Pneumothorax / free air | Upright CXR |
| Bone metastases | Bone scan |
| Cholecystitis, equivocal | HIDA (non-visualization) |
| Renal scarring / obstruction | DMSA / MAG3 |
| Breast | <30 y: US. ≥40 y: mammography |

**Contrast and safety:** gadolinium: NSF if GFR <30. Iodinated: nephropathy risk, hydrate. MRI contraindications: non-conditional pacemaker, cochlear implants, ferromagnetic clips.

**Classic signs:**
- CHF: Kerley B lines.
- PE: Hampton hump and Westermark sign.
- Esophageal rupture or aortic injury: widened mediastinum.
- UC: lead-pipe colon.
- Crohn: string sign.
- Colon cancer: apple core.
- Achalasia: bird's beak.
- Ankylosing spondylitis: bamboo spine.
- Renal osteodystrophy: rugger jersey spine.
- Hyperparathyroidism: salt-and-pepper skull, brown tumors.
- Psoriatic arthritis: pencil-in-cup.
- Osteosarcoma: sunburst. Ewing: onion skin.
- Giant cell tumor: soap bubble.

## 7. Traps and quick rules
- **Mydriatics in angle closure:** never.
- **Steroids before diagnosing keratitis:** avoid (HSV worsens).
- **Delaying GCA steroids for biopsy:** don't.
- **Biopsy of a juvenile angiofibroma:** bleeding risk. Don't.
- **Open biopsy of a neck mass first:** FNA first.
- **Scrotal biopsy or incision for testicular tumor:** inguinal orchiectomy only.
- **Catheter in suspected urethral injury:** urethrogram first.
- **Waiting for imaging in suspected torsion:** don't delay surgery.
- **Normal early scaphoid X-ray:** still immobilize.
- **Checking only the fracture:** assess pulses and nerves.

## 8. Pattern shortcuts
- Painful red eye + halos + mid-dilated pupil → angle closure.
- Sudden painless vision loss + cherry-red macula → CRAO.
- Curtain over vision + flashes → retinal detachment.
- Obese adolescent with knee pain → SCFE (examine the hip).
- Adolescent + sudden scrotal pain → torsion.
- Smoker + painless hematuria → bladder cancer.
- Hematuria + flank mass + polycythemia → RCC.
- Young man + painless testicular mass → seminoma.
- Elderly woman + fall + shortened externally rotated leg → hip fracture.
- Teen + night bone pain relieved by NSAIDs → osteoid osteoma.

## 9. If you only remember 7 things
1. Painless sudden vision loss = vascular emergency; painful red eye + mid-dilated pupil = acute angle closure.
2. GCA: steroids first, biopsy later.
3. Torsion: operate without waiting for imaging.
4. Painless hematuria in an adult: cystoscopy + CT urography.
5. Open fracture: antibiotics + debridement. Compartment syndrome: fasciotomy.
6. Testicular tumor: inguinal orchiectomy only.
7. Pick imaging by organ and urgency: stroke CT, stone CT, biliary/pelvic/pediatric US, spinal cord and brain MRI.

**Estimated:** orthopedic trauma, urologic emergencies and imaging choice are probably the heaviest areas here. ENT and ophthalmology are likely lighter.

</script>
</section>

<section data-title="Preventive Medicine, Ethics, Forensics">
<script type="text/markdown">
# Preventive/Community Medicine, Ethics, Forensics: high-yield

**Known** = standard textbook/guideline facts. **Estimated** = my judgment of exam frequency or Iran-specific details.
**Sources:** Park's Preventive & Social Medicine, Gordis Epidemiology, Beauchamp & Childress, Knight's Forensic Pathology, Goldfrank's Toxicology. These are from my training knowledge, not looked up live.

## 1. Decision rules
- **Biostatistics:** identify the data type (categorical or numeric), the number of groups, and whether samples are paired. That picks the test.
- **Study design:** rare disease → case-control. Rare exposure or incidence → cohort. Causation or treatment effect → RCT. Prevalence → cross-sectional.
- **Prevention level:** before disease = primary. Early detection = secondary. Limiting disability/rehabilitation = tertiary.
- **Ethics:** capable adult's informed refusal is respected. Emergency with no surrogate → treat (implied consent). Confidentiality is broken only for serious danger to others, mandatory reporting, or legal orders.
- **Forensics:** preserve evidence, document everything, and report suspected abuse or unnatural death.

## 2. Biostatistics and epidemiology

| Topic | Fact |
|---|---|
| Sensitivity / specificity | Sensitivity = TP/(TP+FN). Specificity = TN/(TN+FP). SNOUT: sensitive test rules out. SPIN: specific test rules in. Screening test: high sensitivity. Confirmatory: high specificity |
| PPV / NPV | Depend on prevalence. Higher prevalence → higher PPV, lower NPV |
| Prevalence vs incidence | Prevalence ≈ incidence × duration. Better treatment that doesn't cure raises prevalence |
| Study measures | Case-control: odds ratio. Cohort: relative risk, incidence. Cross-sectional: prevalence |
| RR / OR interpretation | CI containing 1 means not significant. For a difference, CI containing 0 means not significant |
| NNT | 1 / absolute risk reduction |
| Tests | 2 means: t-test (paired if before/after). >2 means: ANOVA. 2 categorical variables: chi-square (Fisher if small counts). Correlation: Pearson (normal), Spearman (non-normal). Survival: Kaplan-Meier, log-rank. Non-normal 2 groups: Mann-Whitney |
| Type I vs II error | Type I (α): false positive. Type II (β): false negative. Power = 1 − β. Bigger sample → more power |
| Normal distribution | Mean ± 1 SD ≈ 68%. ±2 SD ≈ 95%. ±3 SD ≈ 99.7% |
| Bias | Case-control: recall and selection bias. Cohort: loss to follow-up. Screening: lead-time and length-time bias. Confounding: control by randomization, matching, stratification, regression |
| RCT | Randomization removes confounding. Blinding removes observer bias. Intention-to-treat preserves randomization |
| Screening criteria (Wilson-Jungner) | Important disease, long latent phase, acceptable test, effective treatment available, cost-effective |
| Outbreak steps | Confirm outbreak and diagnosis, define cases, find cases, descriptive epidemiology, hypothesis, test it, control measures |
| Standardization | Compare populations with different age structures. Direct needs age-specific rates in the study population. Indirect (SMR) is for small populations |
| Vital indicators | Infant mortality: deaths <1 y per 1000 live births. Maternal mortality ratio: per 100,000 live births. Neonatal: first 28 days |

## 3. Vaccines, health system and occupational health

| Topic | Fact |
|---|---|
| Live vaccines | BCG, MMR, varicella, OPV, rotavirus, yellow fever, oral typhoid, intranasal flu. Contraindicated in pregnancy and immunocompromise |
| Inactivated / subunit | IPV, hepatitis B, hepatitis A, rabies, influenza injection, pneumococcal, HPV, meningococcal, Hib, DTP |
| True contraindications | Anaphylaxis to prior dose or component. Mild illness, low-grade fever, antibiotics, and breastfeeding are not contraindications |
| Cold chain | Vaccines 2-8 °C. Don't freeze (DTP, hepatitis B, IPV are freeze-sensitive). Oral polio and measles are heat-sensitive |
| Herd immunity | Threshold = 1 − 1/R₀. Measles has the highest R₀ (~12-18), so it needs ~95% coverage |
| Iran health system | Primary care network built on health houses and community health workers (behvarz), rural and urban health centers, and the family physician program. **Estimated; verify against the current syllabus** |
| Occupational | Lead: basophilic stippling, wrist drop, Burton line. Silica: upper-lobe nodules, TB risk. Asbestos: mesothelioma, pleural plaques, lung cancer. Coal: anthracosis. Cotton: byssinosis (Monday chest tightness). Benzene: leukemia. Vinyl chloride: hepatic angiosarcoma. Carbon monoxide: foundry/garage |
| Nutrition | Vitamin A: night blindness, Bitot spots. Iodine deficiency: goiter and cretinism. Kwashiorkor: edema, protein deficiency. Marasmus: wasting, calorie deficiency |

## 4. Medical ethics

| Topic | Fact |
|---|---|
| Four principles | Autonomy, beneficence, non-maleficence, justice |
| Informed consent | Needs capacity, adequate information, voluntariness. Surgeon (not a delegate) obtains consent for a procedure |
| Capacity | Understand, appreciate consequences, reason, express a choice. Decision-specific and can fluctuate. Psychiatric diagnosis alone ≠ incapacity |
| Emergency | Life-threatening, no surrogate, no known refusal: treat under implied consent |
| Minors | Parents/guardians consent. Child at risk and parents refuse life-saving treatment (e.g., blood for a Jehovah's Witness child): treat and involve the court/authorities. Adult with capacity refusing blood: respect it |
| Confidentiality exceptions | Serious risk to identifiable third party (Tarasoff), reportable infectious disease, child or elder abuse, court order. Otherwise only with patient consent |
| Disclosure | Disclose errors honestly. Give the patient bad news with an appropriate setting and support. Family can't override a capable patient's wish to know |
| End of life | Withholding or withdrawing futile treatment is acceptable with consent. Euthanasia is illegal in Iran. **Verify with local regulation** |
| Research ethics | Informed consent, ethics committee approval, risk-benefit, confidentiality. Declaration of Helsinki. Vulnerable groups need extra protection |
| Brain death | Irreversible loss of all brain function including brainstem; apnea test. Exclude confounders (hypothermia, sedatives, shock) first |
| Conflict of interest | Declare it. Don't accept gifts that influence prescribing. Don't treat family members except in emergencies |

## 5. Forensic medicine and toxicology

| Topic | Fact |
|---|---|
| Postmortem changes | Algor mortis (cooling): ~1 °C/h at first. Livor mortis: appears 30 min-2 h, fixed after ~8-12 h; shifted body position after fixation means the body was moved. Rigor mortis: starts 2-4 h, full ~12 h, gone ~24-36 h; starts in small muscles first. Putrefaction: green discoloration of the right iliac fossa first |
| Time of death | Estimate from the combination, not a single sign. Vitreous potassium rises with time |
| Wounds | Abrasion: epidermis only. Contusion: vessel damage. Laceration: tearing with tissue bridges. Incised: clean, longer than deep. Stab: deeper than long. Defense wounds on hands/forearms suggest homicide |
| Firearm | Contact shot: soot in the wound, muzzle imprint, cruciate tearing on bone. Entry wound: abrasion collar. Exit wound: usually larger, irregular |
| Asphyxia | Petechiae in the face, conjunctivae and serosal surfaces. Hanging: oblique, high ligature mark. Strangulation: horizontal mark, hyoid fracture. Drowning: froth at mouth, diatoms |
| Cause vs manner of death | Cause: injury or disease causing death. Manner: natural, accident, suicide, homicide, undetermined |
| Medico-legal autopsy | Required in unnatural, suspicious, or unexplained deaths. A forensic physician/legal medicine authority handles it; clinicians report and document, they don't decide legal findings. **Iranian legal medicine details: verify** |
| Child/sexual abuse | Report. Collect evidence early (swabs, clothing, chain of custody). Treat injuries, give emergency contraception, STI prophylaxis, tetanus, and HBV/HIV PEP as indicated |
| Age estimation | Dentition and ossification centers in the young, epiphyseal fusion until the mid-20s, then degenerative changes |
| Antidotes | Organophosphate: atropine + pralidoxime. Opioid: naloxone. Benzodiazepine: flumazenil (caution in dependence/seizure risk). Paracetamol: N-acetylcysteine. Methanol/ethylene glycol: fomepizole (or ethanol), dialysis if severe. Iron: deferoxamine. Lead: succimer/EDTA/dimercaprol. Arsenic/mercury: dimercaprol. Cyanide: hydroxocobalamin. CO: 100% oxygen. Methemoglobinemia: methylene blue. Digoxin: digoxin-specific Fab. β-blocker/CCB: glucagon/calcium. TCA: sodium bicarbonate. Warfarin: vitamin K (+ PCC if severe). Heparin: protamine. Anticholinergic: physostigmine |
| Classic clues | CO: cherry-red lividity. Cyanide: bitter almond smell. Organophosphate: miosis, salivation, bradycardia. Arsenic: garlic breath, Mees lines. Methanol: visual loss, high anion gap. Salicylate: tinnitus, respiratory alkalosis then metabolic acidosis |

## 6. Traps and quick rules
- **Ruling out vs ruling in:** a negative sensitive test rules out, a positive specific test rules in.
- **PPV and prevalence:** PPV changes with prevalence. Sensitivity and specificity don't.
- **Case-control studies:** give odds ratios, not incidence.
- **Better treatment and prevalence:** prevalence can go up if people live longer.
- **Treating a capable adult over refusal:** don't, even if the decision seems unwise.
- **Breaking confidentiality:** only for danger to others, mandatory reporting, or court order. Not for curiosity or family pressure.
- **Mild fever or antibiotics before vaccination:** not contraindications.
- **Live vaccine in pregnancy or severe immunosuppression:** contraindicated.
- **Interpreting a CI:** check whether it crosses 1 (ratios) or 0 (differences).
- **Forensic evidence:** collect and label it with chain of custody. Don't clean or discard.

## 7. Pattern shortcuts
- Rare disease + past exposure question → case-control, odds ratio.
- Follow exposed vs unexposed people forward → cohort, relative risk.
- Before-after measurement in the same people → paired t-test.
- >2 group means → ANOVA.
- Screening program with false reassurance risk → test must be sensitive.
- Child needs blood, parents refuse → treat, involve authorities. Adult refuses → respect.
- Patient tells therapist about a plan to kill a specific person → duty to protect (Tarasoff).
- Cherry-red lividity → CO. Bitter almond → cyanide. Miosis + salivation → organophosphate.
- Hyoid fracture + horizontal ligature mark → manual or ligature strangulation.
- Livor that doesn't match body position → body was moved after death.

## 8. If you only remember 7 things
1. Study design picks the measure: case-control → OR, cohort → RR, cross-sectional → prevalence.
2. Sensitivity rules out, specificity rules in. PPV rises with prevalence.
3. Test choice: 2 means → t-test, >2 → ANOVA, categorical → chi-square.
4. Live vaccines are contraindicated in pregnancy and immunosuppression. Mild illness is not a contraindication.
5. Capable adults can refuse. Emergencies use implied consent. Breach confidentiality only for danger to others, mandatory reporting, or court order.
6. Time of death: livor 30 min-2 h (fixed ~8-12 h), rigor 2-4 h to ~12 h, then gone by ~24-36 h.
7. Memorize the antidotes: organophosphate (atropine + pralidoxime), opioid (naloxone), paracetamol (NAC), methanol (fomepizole), cyanide (hydroxocobalamin), CO (100% O₂).

**Estimated:** biostatistics, epidemiology study design, vaccines and ethics scenarios are probably the heaviest parts. Iran-specific policy, legal medicine rules and the exact vaccine schedule are the parts I'm least sure of. Check them against the Sanjesh syllabus and current Ministry of Health guidance.

Noted. I can't verify the syllabus, so I'll go with yours and cover only pharmacology and pathology. If other basic sciences are tested, check the Sanjesh syllabus.

# Pharmacology + Pathology: high-yield

**Known** = standard textbook facts. **Estimated** = my judgment of exam frequency.
**Sources:** Katzung 15e, Goodman & Gilman, Robbins & Cotran 10e, from my training knowledge (not looked up live).

# PHARMACOLOGY

## 1. Decision rules
- Identify the **mechanism**, then the **toxicity**: most questions ask for one of them.
- **Zero-order** elimination (phenytoin, ethanol, aspirin at high dose) gives unpredictable levels. **First-order** is the rule otherwise.
- **CYP inducers** lower the levels of other drugs. **Inhibitors** raise them.
- Pregnancy: avoid ACEi/ARB, warfarin, tetracyclines, isotretinoin, valproate, statins, aminoglycosides.
- Antidote questions: match the toxin to the antidote (see the Forensics section above).

## 2. Highest-yield facts

| Topic | Fact |
|---|---|
| CYP inducers | Rifampin, phenytoin, carbamazepine, phenobarbital, St John's wort, chronic alcohol |
| CYP inhibitors | Ketoconazole, macrolides (not azithromycin), cimetidine, ciprofloxacin, grapefruit juice, amiodarone, metronidazole |
| Autonomic | Atropine: dry, hot, blind, mad. Neostigmine: myasthenia/ileus. Phenylephrine: α1. Clonidine: α2 |
| β-blockers | Contraindicated in asthma and in cocaine toxicity. Avoid in acute decompensated HF. Masks hypoglycemia |
| Antihypertensives | ACEi: cough, hyperK, angioedema, teratogenic. CCB (verapamil/diltiazem): AV block; amlodipine: edema. Hydralazine/minoxidil: reflex tachycardia, lupus-like syndrome (hydralazine) |
| Diuretics | Loop: hypoK, ototoxicity, hypoCa. Thiazide: hypoK, hyperCa, hyperuricemia, hyperglycemia. Spironolactone: hyperK, gynecomastia. Acetazolamide: metabolic acidosis |
| Antiarrhythmics | Amiodarone: pulmonary fibrosis, thyroid, corneal deposits, QT. Class IC: avoid after MI. Adenosine: SVT. Digoxin toxicity: hyperK, yellow vision, any arrhythmia |
| Nitrates | PDE5 inhibitors are contraindicated with nitrates. Monday disease |
| Statins | Myopathy, hepatotoxicity. CYP3A4 interactions |
| Anticoagulants | Heparin: HIT, protamine reversal. Warfarin: CYP2C9/VKORC1, vitamin K, teratogenic, skin necrosis (protein C). DOACs: idarucizumab (dabigatran), andexanet (Xa inhibitors) |
| Antiplatelets | Aspirin: irreversible COX-1. Clopidogrel: ADP P2Y12, CYP2C19 prodrug |
| Diabetes | Metformin: lactic acidosis. Sulfonylureas: hypoglycemia, weight gain. SGLT2i: genital infections, euglycemic DKA. GLP-1: pancreatitis, thyroid C-cell tumor warning. Pioglitazone: edema, HF, fractures |
| Thyroid | PTU: first trimester; hepatotoxicity. Methimazole: agranulocytosis, teratogenic in first trimester |
| Steroids | Cushingoid, osteoporosis, hyperglycemia, adrenal suppression (taper), avascular necrosis, cataract |
| Antibiotics: toxicity | Aminoglycosides: nephro-/ototoxicity. Vancomycin: red man syndrome, nephrotoxicity. Chloramphenicol: gray baby, aplastic anemia. Fluoroquinolones: tendon rupture, QT, cartilage. Tetracyclines: teeth, bones. Macrolides: QT, CYP. Linezolid: myelosuppression, serotonin syndrome. Metronidazole: disulfiram-like reaction. TMP-SMX: hyperK, kernicterus, folate |
| β-lactams | Penicillin: cross-reaction with cephalosporins is low. Carbapenems: seizures. Aztreonam: safe in penicillin allergy |
| Antifungals / antivirals | Amphotericin B: nephrotoxicity, hypoK. Azoles: CYP inhibition. Ganciclovir: bone marrow. Acyclovir: crystal nephropathy. Oseltamivir: neuraminidase |
| TB drugs | See the ID section |
| Antimalarials | Primaquine/dapsone: hemolysis in G6PD deficiency. Chloroquine: retinopathy |
| Anticancer toxicity | Doxorubicin: cardiotoxicity (dexrazoxane). Bleomycin: pulmonary fibrosis. Cisplatin: nephro-/ototoxicity, neuropathy. Cyclophosphamide: hemorrhagic cystitis (mesna). Vincristine: neuropathy. Methotrexate: myelosuppression, hepatotoxicity (leucovorin rescue). Trastuzumab: cardiotoxicity. 5-FU: myelosuppression. Tamoxifen: endometrial cancer, VTE |
| Immunosuppressants | Cyclosporine/tacrolimus: nephrotoxicity, tremor. Mycophenolate: GI, marrow. Azathioprine: toxicity increased with allopurinol |
| Neuro-psych drugs | See the Neurology + Psychiatry section |
| Anesthetics | Malignant hyperthermia: halothane/succinylcholine, dantrolene. Propofol: infusion syndrome. Ketamine: dissociation. Local anesthetic toxicity: lipid emulsion |
| Opioids / NSAIDs | Opioid: miosis, constipation, respiratory depression, naloxone. NSAIDs: GI ulcer, renal injury, avoid late pregnancy (PDA closure). Paracetamol: hepatic necrosis, NAC |
| Gout | Allopurinol: SJS (HLA-B*58:01). Colchicine: diarrhea. Probenecid: blocks urate secretion. Febuxostat |
| Drug-induced syndromes | Lupus: hydralazine, procainamide, isoniazid. SJS: allopurinol, carbamazepine, sulfa, lamotrigine. Gingival hyperplasia: phenytoin, cyclosporine, CCB. Hemolysis in G6PD: primaquine, dapsone, sulfa. Cough: ACEi. QT: macrolides, antipsychotics, ondansetron |

## 3. Traps
- **Zero vs first-order kinetics:** phenytoin is saturable, so small dose increases cause big level jumps.
- **Inducers vs inhibitors:** rifampin reduces OCP and warfarin effect. Ketoconazole raises them.
- **Prodrugs:** clopidogrel and codeine need CYP activation, so inhibitors reduce their effect.
- **Loading dose** depends on Vd. **Maintenance dose** depends on clearance.
- **Half-life** ≈ 0.7 × Vd/CL. Steady state takes ~4-5 half-lives.
- **Competitive antagonist:** shifts the dose-response curve right, no change in Emax. **Noncompetitive:** lowers Emax.

# PATHOLOGY

## 1. Decision rules
- **Acute inflammation:** neutrophils, edema. **Chronic:** macrophages, lymphocytes, fibrosis, granulomas.
- **Necrosis:** swelling, inflammation (pathologic). **Apoptosis:** shrinkage, no inflammation, caspases.
- **Benign vs malignant:** invasion and metastasis, not cell size.
- **Tumor markers** suggest and monitor, they don't diagnose.
- Match **microscopic hallmark → disease**, since pathology questions are mostly this.

## 2. Highest-yield facts

| Topic | Fact |
|---|---|
| Cell injury | Reversible: swelling, fatty change. Irreversible: nuclear changes (pyknosis, karyorrhexis, karyolysis), membrane damage, high enzymes |
| Necrosis types | Coagulative: infarcts (except brain). Liquefactive: brain, abscess. Caseous: TB. Fat: pancreatitis, breast trauma. Fibrinoid: vasculitis, malignant hypertension |
| Apoptosis | Caspases, bcl-2 (anti), bax (pro). p53 triggers apoptosis |
| Inflammation | Neutrophils first (hours), monocytes later. Histamine: early vascular permeability. Bradykinin and PGE2: pain. IL-1/TNF: fever. Chemotaxis: C5a, IL-8, LTB4 |
| Granulomas | TB (caseating), sarcoid (non-caseating), Crohn, fungal infection, foreign body. Epithelioid macrophages + giant cells |
| Wound healing | Day 1-3: neutrophils. Day 3-7: macrophages, granulation tissue. 1 wk+: fibroblasts, collagen. Vitamin C deficiency impairs collagen. Keloid: type III→I collagen excess beyond the scar |
| Amyloidosis | Apple-green birefringence with Congo red. AL: plasma cell dyscrasia. AA: chronic inflammation. Transthyretin: elderly heart. Beta-2 microglobulin: dialysis |
| Neoplasia | Dysplasia → carcinoma in situ → invasion. Oncogenes: RAS, MYC (Burkitt, t(8;14)), HER2, BCR-ABL, BCL-2 (follicular lymphoma, t(14;18)). Tumor suppressors: p53, RB, APC, BRCA1/2, NF1/2, VHL, WT1 |
| Cancer syndromes | Li-Fraumeni: p53. Retinoblastoma: RB1. FAP: APC. MEN1: pituitary, parathyroid, pancreas. MEN2A: medullary thyroid, pheochromocytoma, parathyroid (RET). VHL: hemangioblastoma, RCC, pheochromocytoma |
| Carcinogens | Aflatoxin: HCC. Vinyl chloride: angiosarcoma. Asbestos: mesothelioma. Aniline dyes/smoking: bladder. HPV: cervix, anus. H. pylori: gastric MALT lymphoma/adenocarcinoma. EBV: Burkitt, nasopharyngeal carcinoma. HBV/HCV: HCC |
| Paraneoplastic | SCLC: ADH, ACTH. Squamous cell lung: PTHrP. RCC: EPO. HCC: EPO, hypoglycemia. Thymoma: myasthenia |
| Hemodynamics | Virchow triad. Pale infarct: solid organ with end arteries. Red infarct: lung, bowel, venous occlusion. DIC |
| Thrombosis vs postmortem clot | Lines of Zahn indicate antemortem thrombus |
| Shock | Hypovolemic/cardiogenic: cold, clammy. Septic: warm early. Neurogenic: warm, bradycardia |
| Atherosclerosis | Fatty streak → fibrous plaque. Lipid-laden macrophages (foam cells). Aneurysm: AAA (atherosclerosis); thoracic (cystic medial degeneration: Marfan) |
| Vasculitis | GCA: granulomatous, temporal. Takayasu: young Asian woman, pulseless. Polyarteritis nodosa: HBV, spares lungs. Kawasaki: children. GPA: c-ANCA, nose/lung/kidney. Churg-Strauss: asthma + eosinophilia. Microscopic polyangiitis: p-ANCA. HSP: IgA. Buerger: smoker |
| Heart | MI: coagulative necrosis 4-24 h; neutrophils 1-3 d; macrophages 3-14 d; scar >2 wk. Rupture 3-7 d (free wall, tamponade). Rheumatic fever: Aschoff bodies, mitral stenosis. Endocarditis. Cardiomyopathies: dilated (alcohol, doxorubicin), hypertrophic (sarcomere genes, asymmetric septal hypertrophy), restrictive (amyloid) |
| Lung | Emphysema: α1-antitrypsin deficiency (panacinar), smoking (centriacinar). Chronic bronchitis: Reid index >50%. Asthma: Curschmann spirals, Charcot-Leyden crystals. Lung cancer: squamous (central, PTHrP), adenocarcinoma (peripheral, most common, non-smokers), small cell (central, neuroendocrine, ADH/ACTH), large cell. Pancoast: Horner |
| Pneumoconioses | Asbestosis: ferruginous bodies, lower lobes. Silicosis: upper lobes, eggshell calcification. Berylliosis: granulomas. Coal workers: upper lobes |
| GI | Barrett: intestinal metaplasia, adenocarcinoma. Gastric: H. pylori; signet ring cells, linitis plastica; Virchow node. Celiac: villous atrophy. Crohn vs UC (see Internal Medicine). Colon: adenoma→carcinoma sequence (APC → KRAS → p53). Carcinoid: 5-HIAA, appendix/small bowel |
| Liver | Hepatitis B: ground-glass hepatocytes. Alcoholic: Mallory bodies, neutrophils, steatosis. Wilson: ceruloplasmin low. Hemochromatosis: iron, HFE. HCC: AFP. Cirrhosis: bridging fibrosis, regenerative nodules |
| Pancreas/biliary | Pancreatic cancer: ductal adenocarcinoma, KRAS, Trousseau sign. PBC: granulomatous destruction of small bile ducts. PSC: onion-skin fibrosis |
| Kidney | Minimal change: foot process effacement on EM only. FSGS: HIV, heroin. Membranous: spike and dome, anti-PLA2R. Post-strep: subepithelial humps. IgA: mesangial IgA. Alport: basement membrane splitting. Diabetic: Kimmelstiel-Wilson. RPGN: crescents. ATN: muddy brown casts. Polycystic: ADPKD (berry aneurysm) |
| Kidney tumors | RCC (clear cell). Wilms. Transitional cell carcinoma (bladder) |
| Breast | Fibrocystic change: most common. Fibroadenoma: young women, benign. Phyllodes: leaf-like. Invasive ductal: most common. Lobular: E-cadherin loss, bilateral, targetoid. Paget disease: eczematous nipple. Inflammatory: peau d'orange |
| Female genital | Cervical: HPV 16/18, koilocytes. Endometrial hyperplasia: unopposed estrogen. Leiomyoma: benign smooth muscle. Mature teratoma (dermoid): most common germ cell tumor. Endometriosis: ectopic endometrial tissue |
| Male genital | Seminoma: fried-egg cells. Embryonal: hemorrhage. Yolk sac: Schiller-Duval bodies, AFP. Choriocarcinoma: hCG. BPH: nodular hyperplasia. Prostate cancer: acinar adenocarcinoma, peripheral zone, Gleason |
| Blood: anemia | Iron deficiency: microcytic, low ferritin. Thalassemia: target cells, microcytic with normal/high RBC count. Sickle cell: HbS, Howell-Jolly bodies. Megaloblastic: B12/folate. Aplastic: pancytopenia, hypocellular marrow. Hereditary spherocytosis: osmotic fragility, EMA binding |
| Hemolysis | Intravascular: hemoglobinuria, low haptoglobin. G6PD: Heinz bodies, bite cells |
| Leukemia | ALL: TdT+, children. AML: Auer rods, myeloperoxidase+. CML: Philadelphia chromosome, low LAP. CLL: smudge cells, elderly. Hairy cell: TRAP+, tartrate-resistant |
| Lymphoma | Hodgkin: Reed-Sternberg cells (CD15, CD30), bimodal. Burkitt: starry-sky, t(8;14). Follicular: t(14;18) BCL-2. Mantle cell: t(11;14), cyclin D1. Diffuse large B-cell: most common NHL |
| Myeloma | Plasma cells, M-spike, rouleaux, CRAB (hypercalcemia, renal failure, anemia, bone lesions), Bence Jones |
| Coagulation | Hemophilia A: factor VIII, prolonged PTT. Von Willebrand: prolonged bleeding time ± PTT. ITP: antiplatelet antibodies. TTP: ADAMTS13. DIC: low platelets, low fibrinogen, high D-dimer |
| Endocrine | Graves: diffuse hyperplasia. Hashimoto: Hürthle cells, lymphoid follicles. Papillary thyroid: Orphan Annie nuclei, psammoma bodies. Follicular: capsular/vascular invasion. Medullary: amyloid, calcitonin. Pituitary adenoma: prolactinoma most common. Pheochromocytoma: rule of 10s. Adrenal: Addison (autoimmune), Cushing |
| Diabetes | Type 1: autoimmune β-cell destruction, HLA-DR3/4. Type 2: insulin resistance, islet amyloid |
| CNS | Alzheimer: plaques (Aβ), tangles (tau). Parkinson: Lewy bodies, substantia nigra. Huntington: caudate, CAG repeat. Pick: Pick bodies. Creutzfeldt-Jakob: spongiform change. MS: demyelination, plaques. Glioblastoma: pseudopalisading necrosis. Meningioma: psammoma bodies, whorled. Oligodendroglioma: fried-egg, calcification. Medulloblastoma: Homer-Wright rosettes. Schwannoma: Antoni A/B, Verocay bodies |
| Bone | Osteosarcoma, Ewing, giant cell tumor (see Orthopedics). Osteoporosis: normal labs. Osteomalacia/rickets: vitamin D deficiency. Paget: mosaic pattern |
| Skin | Melanoma: Breslow depth. SCC: keratin pearls. BCC: palisading nuclei |
| Genetics | Down: trisomy 21, Robertsonian translocation risk. Edwards: trisomy 18. Patau: trisomy 13. Turner: 45,X. Klinefelter: 47,XXY. Fragile X: CGG repeat. Autosomal recessive: enzyme deficiencies (e.g., PKU, Gaucher). X-linked recessive: males (hemophilia, G6PD, Duchenne). Mitochondrial: maternal inheritance |
| Storage diseases | Gaucher: glucocerebrosidase, crumpled-paper macrophages. Niemann-Pick: sphingomyelinase, foam cells, cherry-red macula. Tay-Sachs: hexosaminidase A, cherry-red macula, no organomegaly. Fabry: α-galactosidase, X-linked. Pompe: acid maltase, cardiomegaly |
| Immunopathology | Type I: IgE, anaphylaxis. Type II: antibody against cell antigens (Goodpasture, hemolytic anemia, myasthenia). Type III: immune complexes (SLE, serum sickness, post-strep GN). Type IV: T-cell (contact dermatitis, TB skin test). Transplant rejection: hyperacute (minutes, preformed antibodies), acute (weeks, T-cell), chronic (months-years, vascular fibrosis) |

## 3. Traps
- **Kidney biopsy findings:** minimal change shows nothing on light microscopy. Membranous shows spike and dome. Post-strep shows humps.
- **Granuloma ≠ TB:** caseation suggests TB. Non-caseating suggests sarcoid.
- **Squamous vs adenocarcinoma of lung:** squamous is central with PTHrP. Adenocarcinoma is peripheral and the most common overall.
- **MI timeline:** neutrophils at 1-3 days. Macrophages at 3-14 days. Rupture risk peaks at 3-7 days.
- **Necrosis types:** the brain is the exception, with liquefactive necrosis after infarction.
- **ANCA types:** c-ANCA = GPA. p-ANCA = MPA and Churg-Strauss.
- **Hodgkin vs NHL:** Reed-Sternberg cell = Hodgkin. Contiguous spread = Hodgkin.

## 4. Pattern shortcuts
- Orphan Annie nuclei + psammoma bodies → papillary thyroid.
- Starry-sky + t(8;14) → Burkitt.
- Auer rods → AML. Smudge cells → CLL. Philadelphia → CML.
- Spike and dome → membranous GN. Subepithelial humps → post-strep GN.
- Reed-Sternberg cells → Hodgkin.
- Pseudopalisading necrosis → glioblastoma.
- Aschoff bodies → rheumatic fever.
- Cherry-red macula + hepatosplenomegaly → Niemann-Pick. No organomegaly → Tay-Sachs.
- Apple-green birefringence on Congo red → amyloid.
- Ground-glass hepatocytes → HBV.
- Signet-ring cells + linitis plastica → diffuse gastric cancer.

## 5. If you only remember 7 things
1. Match each drug to its signature toxicity (e.g., amiodarone, doxorubicin, bleomycin, aminoglycosides).
2. CYP inducers lower other drugs' levels. Inhibitors raise them.
3. Know the MI histology timeline.
4. Tumor genetics: t(9;22) CML, t(8;14) Burkitt, t(14;18) follicular, t(11;14) mantle cell.
5. Kidney: match each glomerular disease to its biopsy finding.
6. Lung and thyroid cancer subtypes with their classic histology.
7. Granuloma + caseation = TB. Apple-green birefringence = amyloid.

**Estimated:** pharmacology adverse effects and drug interactions, plus pathology of the heart, kidney, blood/lymphoma and neoplasia, are probably the heaviest parts. That ranking is my judgment, not a verified weight.

That finishes the list. Want a rapid-fire "top 50 across all subjects" review, or deeper coverage of any one subject?</script>

 s.id="s"+i;
 const src=s.querySelector("script").textContent;
 const h=document.createElement("h2");h.textContent=s.dataset.title;
 const d=document.createElement("div");
 d.innerHTML=src.includes("PASTE_REPLY_HERE")?'<p class="empty">Not added yet.</p>':md(src);
 s.replaceChildren(h,d);
 nav.insertAdjacentHTML("beforeend",`<a href="#s${i}">${s.dataset.title.split(/[,+]/)[0]}</a>`);
});
</script>
</body>
